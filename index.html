<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palindro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 1.5rem;
      color: #111;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 0.4rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.65rem 0.9rem;
      font-size: 1rem;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus { border-color: #666; }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    .input-row input { flex: 1; }

    button {
      padding: 0.65rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      background: #fff;
      color: #555;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    button:hover { background: #f0f0f0; border-color: #bbb; }

    #result {
      margin-top: 1.5rem;
      display: none;
    }

    .verdict {
      font-size: 1.2rem;
      font-weight: 700;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      display: inline-block;
    }

    .verdict.yes { background: #d1fae5; color: #065f46; }
    .verdict.no  { background: #fee2e2; color: #991b1b; }

    .normalized-block {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: #f9f9f9;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
    }

    .normalized-block .label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.3rem;
    }

    .normalized-block .value {
      font-family: monospace;
      font-size: 0.95rem;
      color: #333;
      word-break: break-all;
    }

    .word-count {
      margin-top: 0.75rem;
      font-size: 0.9rem;
      color: #666;
    }

    .word-count span {
      font-weight: 700;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Palindro</h1>
    <label for="input">Enter a word or phrase</label>
    <div class="input-row">
      <input type="text" id="input" placeholder="e.g. A man a plan a canal Panama" autocomplete="off" spellcheck="false">
      <button id="clear">Clear</button>
    </div>
    <div id="result">
      <div class="verdict" id="verdict"></div>
      <div class="normalized-block">
        <div class="label">Normalized</div>
        <div class="value" id="normalized"></div>
      </div>
      <div class="word-count">Words: <span id="word-count">0</span> &nbsp;·&nbsp; Characters: <span id="char-count">0</span></div>
    </div>
  </div>

  <script>
    const inputEl      = document.getElementById('input');
    const resultEl     = document.getElementById('result');
    const verdictEl    = document.getElementById('verdict');
    const normalizedEl = document.getElementById('normalized');
    const wordCountEl  = document.getElementById('word-count');
    const charCountEl  = document.getElementById('char-count');

    function normalize(s) {
      return s.replace(/[^a-z0-9]/gi, '').toLowerCase();
    }

    function countWords(s) {
      return s.trim() === '' ? 0 : s.trim().split(/\s+/).length;
    }

    function check() {
      const raw = inputEl.value;
      const norm = normalize(raw);

      if (norm.length === 0) {
        resultEl.style.display = 'none';
        return;
      }

      const isPalindrome = norm === norm.split('').reverse().join('');

      resultEl.style.display = 'block';
      verdictEl.textContent  = isPalindrome ? 'Palindrome' : 'Not a palindrome';
      verdictEl.className    = 'verdict ' + (isPalindrome ? 'yes' : 'no');
      normalizedEl.textContent = norm;
      wordCountEl.textContent  = countWords(raw);
      charCountEl.textContent  = raw.length;
    }

    inputEl.addEventListener('input', check);

    document.getElementById('clear').addEventListener('click', () => {
      inputEl.value = '';
      resultEl.style.display = 'none';
      inputEl.focus();
    });
  </script>
</body>
</html>
